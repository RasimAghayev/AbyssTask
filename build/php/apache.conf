# The web server listens on a port that needs no privilege, so the container
# can run as the unprivileged www-data user.
Listen 8080

<IfModule mpm_event_module>
    StartServers 2
    MinSpareThreads 25
    MaxSpareThreads 75
    ThreadLimit 64
</IfModule>

<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 25
    MaxSpareServers 75
    MaxRequestWorkers 150
    MaxConnectionsPerChild 0
</IfModule>

# The process writes its state into a place the unprivileged user owns.
PidFile /tmp/apache2.pid
