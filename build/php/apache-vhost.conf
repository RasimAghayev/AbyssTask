<VirtualHost *:8080>
    # The document root of Laravel is the public directory. Everything above
    # it stays out of reach of the web.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The notices of the application go to the log of the container, so a
    # response of the API is never broken by one.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
